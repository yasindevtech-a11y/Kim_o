<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#FF6D00">
<title>Kim_O</title>
<style>
  :root { --bg:#fff7f0; --fg:#2b1b0e; --muted:#7a6552; --accent:#ff6d00; --accent-d:#e65100; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1410; --fg:#fbeee2; --muted:#b9a592; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; }
  body {
    background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center;
  }
  main { width:100%; max-width:420px; padding:24px 20px 40px; }
  .where { font-size:15px; color:var(--muted); margin:0 0 4px; letter-spacing:.02em; }
  h1 { font-size:30px; line-height:1.2; margin:0 0 32px; word-break:break-word; }
  #ring {
    width:220px; height:220px; border-radius:50%; border:0; cursor:pointer;
    background:radial-gradient(circle at 35% 30%, #ff9a47, var(--accent) 55%, var(--accent-d));
    color:#fff; font-weight:800; font-size:20px; letter-spacing:.04em;
    box-shadow:0 14px 34px rgba(230,81,0,.38), inset 0 -6px 14px rgba(0,0,0,.18);
    display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    transition:transform .12s ease, filter .2s ease;
  }
  #ring .ico { font-size:68px; line-height:1; }
  #ring:active:not(:disabled) { transform:scale(.95); }
  #ring:disabled { filter:grayscale(.65) brightness(1.05); cursor:default; box-shadow:none; }
  .msg { min-height:48px; margin:28px 0 8px; font-size:17px; line-height:1.4; }
  .msg.ok { color:#2e7d32; font-weight:600; }
  .msg.err { color:#c62828; font-weight:600; }
  @media (prefers-color-scheme: dark) { .msg.ok{color:#81c784;} .msg.err{color:#ef9a9a;} }
  .timer { font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; }
  #note {
    width:100%; max-width:320px; margin:0 0 22px; padding:12px 14px; resize:none;
    border:1px solid rgba(122,101,82,.4); border-radius:14px; background:transparent; color:var(--fg);
    font:inherit; font-size:16px; line-height:1.35;
  }
  #note:focus { outline:2px solid var(--accent); border-color:transparent; }
  .replies { margin:14px 0 0; text-align:left; }
  .reply {
    margin:8px 0; padding:12px 14px; border-radius:14px; font-size:17px; line-height:1.35;
    background:rgba(46,125,50,.12); border:1px solid rgba(46,125,50,.35); word-break:break-word;
  }
  .reply b { display:block; font-size:12px; font-weight:600; color:var(--muted); margin-bottom:2px; }
  .hidden { display:none !important; }
  .ring-anim { animation:shake .5s ease; }
  @keyframes shake { 0%,100%{transform:rotate(0)} 20%{transform:rotate(-12deg)} 40%{transform:rotate(10deg)} 60%{transform:rotate(-7deg)} 80%{transform:rotate(4deg)} }
</style>
</head>
<body>
<main>
  <p class="where" id="where">Kapı zili</p>
  <h1 id="title">Zil</h1>
  <textarea id="note" rows="2" maxlength="200" placeholder="İsterseniz not yazın (örn. Kargo getirdim)"></textarea>
  <button id="ring" type="button"><span class="ico" id="ico">🔔</span><span>ZİLE BAS</span></button>
  <p class="msg" id="msg"></p>
  <p class="timer" id="timer"></p>
  <div class="replies hidden" id="replies" aria-live="polite"></div>
</main>

<script>
(function () {
  'use strict';
  var TTL = 3 * 60 * 1000;       // oturum süresi: 3 dakika
  var COOLDOWN = 15 * 1000;      // art arda basma beklemesi
  var $ = function (id) { return document.getElementById(id); };

  var btn = $('ring'), msg = $('msg'), timer = $('timer');
  var noteEl = $('note'), repliesEl = $('replies');
  var params = new URLSearchParams(location.hash.replace(/^#/, ''));
  var topic = params.get('t') || '';
  var name = (params.get('n') || 'Zil').slice(0, 60);
  var server = params.get('s') || 'https://ntfy.sh';

  var validTopic = /^[A-Za-z0-9_-]{8,64}$/.test(topic);
  var validServer = /^https:\/\/[A-Za-z0-9.-]+(:\d{1,5})?$/.test(server);

  $('title').textContent = name;
  document.title = name + ' – Kim_O';

  function say(text, cls) { msg.textContent = text; msg.className = 'msg' + (cls ? ' ' + cls : ''); }

  function wipe() {
    // Sayfadaki tüm izleri sil: saklanan süre + adres çubuğundaki kod
    try { localStorage.removeItem('zil_start_' + topic); } catch (e) {}
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    topic = '';
  }

  if (!validTopic || !validServer) {
    btn.classList.add('hidden');
    $('where').classList.add('hidden');
    $('title').textContent = 'Geçersiz bağlantı';
    say('Lütfen kapıdaki QR kodu tekrar okutun.', 'err');
    return;
  }

  // Oturum başlangıcı: 3 dakika içinde yenilenirse süre devam eder
  var key = 'zil_start_' + topic;
  var start = Date.now();
  try {
    var old = parseInt(localStorage.getItem(key) || '0', 10);
    if (old && Date.now() - old < TTL && Date.now() >= old) { start = old; }
    else { localStorage.setItem(key, String(start)); }
  } catch (e) {}

  var cooldownUntil = 0;
  var sending = false;

  // Bu ziyaretçiye özel rastgele kimlik: ev sahibinin yanıtı yalnızca bu oturuma gelir
  var sid = (function () {
    var s = '', i;
    try {
      var a = new Uint8Array(9);
      (window.crypto || window.msCrypto).getRandomValues(a);
      for (i = 0; i < a.length; i++) s += (a[i] % 36).toString(36);
    } catch (e) {
      for (i = 0; i < 9; i++) s += Math.floor(Math.random() * 36).toString(36);
    }
    return s;
  })();

  var es = null, seenIds = {};
  function stopReplies() { if (es) { try { es.close(); } catch (e) {} es = null; } }
  function addReply(text) {
    repliesEl.classList.remove('hidden');
    var p = document.createElement('div');
    p.className = 'reply';
    var who = document.createElement('b');
    who.textContent = 'Ev sahibi';
    var t = document.createElement('span');
    t.textContent = text;
    p.appendChild(who); p.appendChild(t);
    repliesEl.appendChild(p);
  }
  function startReplies() {
    if (es || !window.EventSource || topic.length + sid.length + 1 > 64) return;
    try {
      es = new EventSource(server + '/' + topic + '-' + sid + '/sse?since=all');
      es.onmessage = function (ev) {
        try {
          var d = JSON.parse(ev.data);
          if (d.event !== 'message' || seenIds[d.id]) return;
          seenIds[d.id] = 1;
          var t = String(d.message || '');
          try { var j = JSON.parse(t); if (j && j.r) t = String(j.r); } catch (e) {}
          addReply(t.slice(0, 300));
          if (navigator.vibrate) { try { navigator.vibrate(120); } catch (e) {} }
        } catch (e) {}
      };
    } catch (e) {}
  }

  function expire() {
    clearInterval(tick);
    stopReplies();
    noteEl.classList.add('hidden');
    btn.classList.add('hidden');
    timer.textContent = '';
    wipe();
    say('Süre doldu. Tekrar zil çalmak için QR kodu yeniden okutun.');
  }

  function refresh() {
    var left = TTL - (Date.now() - start);
    if (left <= 0) { expire(); return; }
    var s = Math.ceil(left / 1000);
    timer.textContent = 'Kalan süre ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    var cd = cooldownUntil - Date.now();
    if (cd > 0) {
      btn.disabled = true;
    } else if (!sending) {
      btn.disabled = false;
    }
  }
  var tick = setInterval(refresh, 250);
  refresh();

  btn.addEventListener('click', function () {
    if (sending || Date.now() < cooldownUntil || !topic) return;
    sending = true; btn.disabled = true;
    say('Gönderiliyor…');
    // Gövde: "zil <oturumun açılışından beri geçen saniye>" (saat farkından etkilenmez)
    var elapsed = Math.max(0, Math.floor((Date.now() - start) / 1000));
    var noteText = (noteEl.value || '').replace(/\s+/g, ' ').trim().slice(0, 200);
    var payload = JSON.stringify({ v: 1, e: elapsed, s: sid, n: noteText });
    fetch(server + '/' + encodeURIComponent(topic), { method: 'POST', body: payload })
      .then(function (r) { if (!r.ok) throw new Error('http ' + r.status); })
      .then(function () {
        cooldownUntil = Date.now() + COOLDOWN;
        say('Zil çalındı ✓ Lütfen bekleyin.', 'ok');
        noteEl.value = '';
        startReplies();
        if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) {} }
        var ico = $('ico'); ico.classList.remove('ring-anim'); void ico.offsetWidth; ico.classList.add('ring-anim');
      })
      .catch(function () {
        say('Gönderilemedi. İnternetinizi kontrol edip tekrar deneyin.', 'err');
      })
      .then(function () { sending = false; refresh(); });
  });
})();
</script>
</body>
</html>

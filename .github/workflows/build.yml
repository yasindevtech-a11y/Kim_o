name: APK derle

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: SDK lisanslarını kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: APK derle (ziyaretçi sayfası adresi otomatik gömülür)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "${REPO,,}" = "$OWNER.github.io" ]; then
            PAGE="https://$OWNER.github.io/"
          else
            PAGE="https://$OWNER.github.io/$REPO/"
          fi
          echo "Sayfa adresi: $PAGE"
          gradle assembleDebug --no-daemon -PpageUrl="$PAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: zil-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # APK'yı telefondan kolayca indirmek için "Releases" sayfasına koyar
      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Kim_O v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
